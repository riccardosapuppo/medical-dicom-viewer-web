name: CI

on: [push, pull_request]

jobs:
  # The paging arithmetic and the zip reader are plain modules with no
  # dependencies, so this runs in seconds on Node's built-in test runner.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  # Unit tests say nothing about whether the extension still compiles against
  # OHIF, which is the failure that actually matters here. This assembles the
  # distribution and builds it, which is slow and worth it.
  build:
    name: Build the viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assemble the OHIF distribution
        run: npm run setup
      - name: Build
        run: npm run build
