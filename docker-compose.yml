# The archive the viewer reads from.
#
# Only the archive is containerised. The viewer is OHIF, built from the
# distribution that scripts/setup-ohif.mjs assembles, and is run with
# `npm run dev`: putting a 200 MB webpack build inside an image would add
# minutes to every start for no benefit to anyone reading this repository.
services:
  orthanc:
    image: orthancteam/orthanc:26.4.2
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__NAME: "Radiology workflow demonstration archive"
      ORTHANC__DICOM_AET: "DEMO"
      # No authentication and remote access allowed: this holds published,
      # de-identified images and is meant to be started on a laptop. It is not a
      # configuration to copy into anything that holds patient data.
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
    ports:
      - "8042:8042"
    volumes:
      - orthanc-data:/var/lib/orthanc/db
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8042/system', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

volumes:
  orthanc-data:
