<!DOCTYPE html>
<html>
  <head>
    <title>Finestre su piu monitor</title>

    <style>
      :root {
        --fondo: #111418;
        --fondo-alto: #1a1f26;
        --inchiostro: #e2e8f0;
        --inchiostro-tenue: #94a3b8;
        --accento: #38bdf8;
        --bordo: #272e38;
      }

      body {
        text-align: center;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        line-height: 1.8rem;
        padding: 20px;
        width: 450px;
        margin: 0;
        background: var(--fondo);
        color: var(--inchiostro);
      }
      button {
        margin: 5px;
        padding: 10px;
        cursor: pointer;
        background: var(--fondo-alto);
        color: var(--inchiostro);
        border: 1px solid var(--bordo);
        border-radius: 4px;
      }
      button:hover {
        border-color: var(--accento);
      }

      #intestazione {
        background: var(--fondo-alto);
        color: var(--inchiostro);
        border-bottom: 1px solid var(--bordo);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 8px 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      #intestazione h1 {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 0;
      }

      #intestazione img {
        width: 24px;
        height: 24px;
      }

      #descrizione {
        color: var(--inchiostro-tenue);
        line-height: 1rem;
        margin-top: 35px;
        font-size: 0.9rem;
      }

      #info-versione {
        position: fixed;
        bottom: -15px;
        left: 0;
        width: 100%;
        background: var(--fondo-alto);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="intestazione">
      <img src="./icons/icon-48.png" alt="" />
      <h1>Finestre su piu' monitor</h1>
    </div>
    <!-- <button id="salva">Salva Finestra</button>
    <button id="ripristina">Ripristina Finestra</button>
    <script src="popup.js"></script> -->
    <p id="descrizione">
      Distribuisce le finestre del visualizzatore sui monitor della postazione.
      La posizione e la dimensione di ogni finestra vengono salvate e rimesse
      dove erano al caricamento successivo. <br />
      <br />
      <b>La gestione e' accessibile direttamente dal visualizzatore</b>
    </p>



    <p id="info-versione">Versione 1.0</p>
  </body>
</html>
